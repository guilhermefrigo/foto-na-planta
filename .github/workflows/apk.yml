name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Gerar projeto e compilar (APK sem assinatura)
        run: |
          set -o pipefail
          mkdir -p saida
          {
            cd android
            npm init -y >/dev/null
            npm install @bubblewrap/core@1.27.0
            VERSION_CODE=${{ github.run_number }} node gerar-projeto.js ../twa
            cd ../twa
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          } 2>&1 | tee saida/build.log
          cp twa/app/build/outputs/apk/release/*.apk saida/foto-na-planta-unsigned.apk
      - name: Publicar resultado no branch apk-build
        if: always()
        run: |
          mkdir -p saida && cp twa/app/build/outputs/apk/release/*.apk saida/foto-na-planta-unsigned.apk 2>/dev/null || true
          cd saida
          git init -q -b apk-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "run ${{ github.run_number }} - ${{ job.status }}" > STATUS.txt
          git add -A && git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-build
